<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Geopolitics RP 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { background: var(--accent); color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
        .hidden { display: none; }
        .badge { background: #334155; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: var(--accent);">🌍 GLOBAL GEOPOLITICS RP</h1>

    <!-- ФОРМА ВХОДУ ТА РЕЄСТРАЦІЇ -->
    <div id="authSection" class="card">
        <h2>🔑 Вхід / Реєстрація Держави</h2>
        <div class="form-group">
            <label>Нікнейм Правителя / Логін:</label>
            <input type="text" id="usernameInput" placeholder="Наприклад: King_Bober">
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="passwordInput" placeholder="******">
        </div>
        <div class="form-group">
            <label>Назва Країни (для нових гравців):</label>
            <input type="text" id="countryInput" placeholder="Наприклад: Імперія Панама">
        </div>
        <button class="btn" onclick="loginOrRegister()">Увійти / Зареєструвати країну</button>
    </div>

    <!-- КАБІНЕТ ГРАВЦЯ -->
    <div id="gameSection" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="countryTitle">Держава</h2>
                <button class="btn btn-danger" style="width: auto;" onclick="logout()">Вийти</button>
            </div>
            <p>Правитель: <b id="rulerName" style="color: var(--accent);"></b></p>

            <div class="stats-grid">
                <div class="stat-box">Бюджет<br><b id="statBudget" style="font-size: 1.3em; color: var(--success);">0</b> млн $</div>
                <div class="stat-box">Дохід/день<br><b id="statIncome" style="font-size: 1.3em;">+0</b> млн $</div>
                <div class="stat-box">Енергобаланс<br><b id="statEnergy" style="font-size: 1.3em;">0%</b></div>
                <div class="stat-box">Щастя<br><b id="statHappiness" style="font-size: 1.3em;">50%</b></div>
            </div>

            <h4 style="margin-top:20px;">🏛 Збудовані об'єкти:</h4>
            <p id="buildingsList">Завантаження...</p>
        </div>

        <!-- МАГАЗИН БУДІВНИЦТВА -->
        <div class="card">
            <h3>🏗️ Реєстр Державних Об'єктів</h3>
            <div class="shop-grid" id="shopGrid"></div>
        </div>
    </div>
</div>

<script>
    // 🔗 ПІДКТЮЧЕННЯ ДО БАЗИ ДАНИХ SUPABASE
    const SUPABASE_URL = "https://gptbmqdrradqzhdllpyu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_As0ToC3PuPZ6TbYcUJa_pA_-iid8HOe";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentPlayer = null;

    const buildingCatalog = [
        { name: "⚡️ АЕС", cost: 764, income: 0, energy: 25 },
        { name: "💧 ГЕС", cost: 392, income: 0, energy: 15 },
        { name: "🔥 ТЕС", cost: 274, income: 0, energy: 18 },
        { name: "🌬️ ВЕС", cost: 106, income: 0, energy: 8 },
        { name: "🏛️ Урядовий квартал", cost: 500, income: 0, energy: -20 },
        { name: "🛂 Митний термінал", cost: 600, income: 30, energy: 0 },
        { name: "🚔 Поліцейський департамент", cost: 180, income: 0, energy: -5 },
        { name: "🕵️ Штаб Розвідки", cost: 500, income: 0, energy: -10 },
        { name: "📦 Поштова мережа", cost: 180, income: 25, energy: -5 },
        { name: "🛳 Морський порт", cost: 800, income: 100, energy: -20 },
        { name: "🗼 Вишка 3G", cost: 150, income: 10, energy: -5 },
        { name: "📡 Вишка 4G", cost: 300, income: 25, energy: -10 },
        { name: "⚡️ Вишка 5G", cost: 650, income: 60, energy: -15 },
        { name: "🖥 Серверний Центр", cost: 520, income: 50, energy: -25 },
        { name: "🏭 Завод", cost: 48, income: 15, energy: -5 },
        { name: "🌾 Агрокомплекс", cost: 96, income: 20, energy: -15 },
        { name: "🛍️ Торговий центр (ТЦ)", cost: 180, income: 70, energy: -20 },
        { name: "🍔 Мережа фастфуду", cost: 96, income: 40, energy: -15 },
        { name: "🏦 Центральний Банк", cost: 950, income: 120, energy: -25 },
        { name: "🎓 Науковий Центр", cost: 350, income: 30, energy: -15 },
        { name: "🏥 Центральна Лікарня", cost: 250, income: 0, energy: -10 },
        { name: "⚔️ Казарма (+10к військ)", cost: 48, income: 0, energy: 0 },
        { name: "🚜 Танковий ангар (+5 танків)", cost: 72, income: 0, energy: -5 },
        { name: "✈️ Аеродром (+4 літаки)", cost: 180, income: 0, energy: -10 },
        { name: "🛡 Комплекс ППО/ПРО", cost: 600, income: 0, energy: -15 },
        { name: "🚀 Ракетна база", cost: 750, income: 0, energy: -20 }
    ];

    async function loginOrRegister() {
        const user = document.getElementById('usernameInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        const country = document.getElementById('countryInput').value.trim();

        if(!user || !pass) return alert('Заповніть логін та пароль!');

        // Перевіряємо наявність гравця у базі
        let { data, error } = await db.from('players').select('*').eq('username', user).single();

        if(data) {
            if(data.password !== pass) return alert('Невірний пароль!');
            currentPlayer = data;
        } else {
            if(!country) return alert('Введіть назву країни для реєстрації!');
            let { data: newPlayer, error: createError } = await db.from('players').insert([{
                username: user,
                password: pass,
                country_name: country,
                buildings: ["🏛️ Урядовий квартал"]
            }]).select().single();

            if(createError) return alert('Помилка реєстрації: ' + createError.message);
            currentPlayer = newPlayer;
        }

        loadGameUI();
    }

    function loadGameUI() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('gameSection').classList.remove('hidden');

        document.getElementById('countryTitle').innerText = currentPlayer.country_name;
        document.getElementById('rulerName').innerText = currentPlayer.username;
        document.getElementById('statBudget').innerText = currentPlayer.budget;
        document.getElementById('statIncome').innerText = '+' + currentPlayer.income;
        document.getElementById('statEnergy').innerText = currentPlayer.energy + '%';
        document.getElementById('statHappiness').innerText = currentPlayer.happiness + '%';
        
        document.getElementById('buildingsList').innerText = currentPlayer.buildings ? currentPlayer.buildings.join(', ') : 'Немає';

        renderShop();
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';
        buildingCatalog.forEach(b => {
            grid.innerHTML += `
                <div class="item-card">
                    <div>
                        <b>${b.name}</b><br>
                        Ціна: <b style="color:var(--accent);">${b.cost} млн $</b><br>
                        Дохід: +${b.income} млн/день<br>
                        Енергія: ${b.energy}%
                    </div>
                    <button class="btn btn-success" style="margin-top:10px;" onclick="buyBuilding('${b.name}', ${b.cost}, ${b.income}, ${b.energy})">Збудувати</button>
                </div>
            `;
        });
    }

    async function buyBuilding(name, cost, income, energy) {
        if(currentPlayer.budget < cost) return alert('Нестача коштів у бюджеті!');

        currentPlayer.budget -= cost;
        currentPlayer.income += income;
        currentPlayer.energy += energy;
        if(!currentPlayer.buildings) currentPlayer.buildings = [];
        currentPlayer.buildings.push(name);

        // Збереження в хмарі Supabase 24/7
        const { error } = await db.from('players').update({
            budget: currentPlayer.budget,
            income: currentPlayer.income,
            energy: currentPlayer.energy,
            buildings: currentPlayer.buildings
        }).eq('id', currentPlayer.id);

        if(error) return alert('Помилка збереження: ' + error.message);

        alert(`Об'єкт ${name} успішно збудовано!`);
        loadGameUI();
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
