<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Geopolitics RP 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .form-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { background: var(--accent); color: #0f172a; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
        
        /* КНОПКИ КАТЕГОРІЙ */
        .category-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .cat-btn { background: #0f172a; border: 1px solid #334155; color: var(--text); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: var(--accent); color: #0f172a; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .item-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
        .hidden { display: none; }
        .effects-list { font-size: 0.9em; color: #94a3b8; margin: 8px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align: center; color: var(--accent);">🌍 GLOBAL GEOPOLITICS RP</h1>

    <!-- ФОРМА ВХОДУ ТА РЕЄСТРАЦІЇ -->
    <div id="authSection" class="card">
        <h2>🔑 Вхід / Реєстрація Держави</h2>
        <div class="form-group">
            <label>Нікнейм Правителя / Логін:</label>
            <input type="text" id="usernameInput" placeholder="Наприклад: King_Bober">
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="passwordInput" placeholder="******">
        </div>
        <div class="form-group">
            <label>Назва Країни (для нових гравців):</label>
            <input type="text" id="countryInput" placeholder="Наприклад: Імперія Панама">
        </div>
        <button class="btn" onclick="loginOrRegister()">Увійти / Зареєструвати країну</button>
    </div>

    <!-- КАБІНЕТ ГРАВЦЯ -->
    <div id="gameSection" class="hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="countryTitle">Держава</h2>
                <button class="btn btn-danger" style="width: auto;" onclick="logout()">Вийти</button>
            </div>
            <p>Правитель: <b id="rulerName" style="color: var(--accent);"></b></p>

            <div class="stats-grid">
                <div class="stat-box">Бюджет<br><b id="statBudget" style="font-size: 1.3em; color: var(--success);">0</b> млн $</div>
                <div class="stat-box">Дохід/день<br><b id="statIncome" style="font-size: 1.3em;">+0</b> млн $</div>
                <div class="stat-box">Енергобаланс<br><b id="statEnergy" style="font-size: 1.3em;">0%</b></div>
                <div class="stat-box">Щастя<br><b id="statHappiness" style="font-size: 1.3em;">50%</b></div>
            </div>

            <h4 style="margin-top:20px;">🏛 Збудовані об'єкти:</h4>
            <p id="buildingsList">Завантаження...</p>
        </div>

        <!-- МАГАЗИН БУДІВНИЦТВА С КАТЕГОРІЯМИ -->
        <div class="card">
            <h3>🏗️ Повний Реєстр Державних та Корпоративних Об'єктів</h3>
            
            <div class="category-bar">
                <button class="cat-btn active" onclick="switchCategory('energy', this)">⚡️ Енергетика</button>
                <button class="cat-btn" onclick="switchCategory('gov', this)">🏢 Управління</button>
                <button class="cat-btn" onclick="switchCategory('logistics', this)">📦 Логістика</button>
                <button class="cat-btn" onclick="switchCategory('tech', this)">📡 Зв'язок</button>
                <button class="cat-btn" onclick="switchCategory('fuel', this)">⛽️ Паливо</button>
                <button class="cat-btn" onclick="switchCategory('prod', this)">🚜 Виробництво</button>
            </div>

            <div class="shop-grid" id="shopGrid"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://gptbmqdrradqzhdllpyu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_As0ToC3PuPZ6TbYcUJa_pA_-iid8HOe";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentPlayer = null;
    let currentCategory = 'energy';

    const buildingCatalog = [
        // ЕЛЕКТРОЕНЕРГІЯ
        { cat: 'energy', name: "⚡️ АЕС", cost: 764, income: 0, energy: 25, hap: -10, desc: "+25% Ел-енергії, -10% Щастя" },
        { cat: 'energy', name: "💧 ГЕС", cost: 392, income: 0, energy: 15, hap: 0, desc: "+15% Ел-енергії" },
        { cat: 'energy', name: "🔥 ТЕС", cost: 274, income: 0, energy: 18, hap: -5, desc: "+18% Ел-енергії" },
        { cat: 'energy', name: "🌬️ ВЕС", cost: 106, income: 0, energy: 8, hap: 2, desc: "+8% Ел-енергії, +2% Щастя" },
        { cat: 'energy', name: "🔌 ЛЕП (Лінії передач)", cost: 204, income: 10, energy: 5, hap: 0, desc: "Пропускна здатність та стабільність мережі" },

        // УПРАВЛІННЯ ТА БЕЗПЕКА
        { cat: 'gov', name: "🏛 Урядовий квартал", cost: 500, income: 0, energy: -20, hap: 5, desc: "Дає легітимність країні та видачу законів" },
        { cat: 'gov', name: "🛂 Митний термінал", cost: 600, income: 50, energy: 0, hap: 0, desc: "Дозволяє торгувати ресурсами з іншими країнами" },
        { cat: 'gov', name: "🚔 Поліцейський департамент", cost: 180, income: 0, energy: -5, hap: 10, desc: "Захист від бунтів та заколотів" },
        { cat: 'gov', name: "🕵️ Штаб Розвідки", cost: 500, income: 0, energy: -10, hap: 0, desc: "Шпигунство та диверсії" },

        // ЛОГІСТИКА ТА ПОШТА
        { cat: 'logistics', name: "🏭 Логістичний хаб (Склад)", cost: 420, income: 20, energy: -10, hap: 0, desc: "+30% до ліміту доставок матеріалів" },
        { cat: 'logistics', name: "📦 Поштова мережа", cost: 180, income: 25, energy: -5, hap: 5, desc: "+15% дохід пошти, +5% Щастя" },
        { cat: 'logistics', name: "🚛 Автопарк (Депо)", cost: 280, income: 15, energy: -5, hap: 0, desc: "Зменшує витрати палива транспортом" },
        { cat: 'logistics', name: "🛳 Морський порт", cost: 800, income: 100, energy: -20, hap: 0, desc: "+100% ліміт міжнародної торгівлі" },

        // ЗВ'ЯЗОК ТА ТЕХНОЛОГІЇ
        { cat: 'tech', name: "🗼 Вишка 3G", cost: 150, income: 10, energy: -5, hap: 2, desc: "Базовий зв'язок та пошта" },
        { cat: 'tech', name: "📡 Вишка 4G", cost: 300, income: 25, energy: -10, hap: 5, desc: "Потрібна для онлайн-банкінгу" },
        { cat: 'tech', name: "⚡️ Вишка 5G", cost: 650, income: 60, energy: -15, hap: 10, desc: "+25% до прибутку IT-сектору" },
        { cat: 'tech', name: "🖥 Серверний Центр", cost: 520, income: 50, energy: -25, hap: 0, desc: "Необхідний для IT-компаній та дата-центрів" },

        // ЕНЕРГО-ПАЛИВНИЙ СЕКТОР
        { cat: 'fuel', name: "⛽️ Мережа АЗС", cost: 450, income: 45, energy: -5, hap: 0, desc: "Забезпечує паливом цивільний транспорт" },
        { cat: 'fuel', name: "🔌 Зарядні станції (Electro)", cost: 380, income: 35, energy: -15, hap: 5, desc: "Живлення електранспорту та 5G систем" },

        // ВИРОБНИЦТВО ТА СІЛЬСЬКЕ ГОСПОДАРСТВО
        { cat: 'prod', name: "🏭 Завод", cost: 48, income: 15, energy: -5, hap: -2, desc: "+15% виробництва товарів" },
        { cat: 'prod', name: "🌾 Агрокомплекс", cost: 96, income: 20, energy: -15, hap: 5, desc: "+25% вирощування ресурсів" },
        { cat: 'prod', name: "🚜 Ферма", cost: 180, income: 40, energy: -25, hap: 5, desc: "+40% агро-ресурсів" }
    ];

    async function loginOrRegister() {
        const user = document.getElementById('usernameInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        const country = document.getElementById('countryInput').value.trim();

        if(!user || !pass) return alert('Заповніть логін та пароль!');

        let { data, error } = await db.from('players').select('*').eq('username', user).single();

        if(data) {
            if(data.password !== pass) return alert('Невірний пароль!');
            currentPlayer = data;
        } else {
            if(!country) return alert('Введіть назву країни для реєстрації!');
            let { data: newPlayer, error: createError } = await db.from('players').insert([{
                username: user,
                password: pass,
                country_name: country,
                buildings: ["🏛 Урядовий квартал"]
            }]).select().single();

            if(createError) return alert('Помилка реєстрації: ' + createError.message);
            currentPlayer = newPlayer;
        }

        loadGameUI();
    }

    function loadGameUI() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('gameSection').classList.remove('hidden');

        document.getElementById('countryTitle').innerText = currentPlayer.country_name;
        document.getElementById('rulerName').innerText = currentPlayer.username;
        document.getElementById('statBudget').innerText = currentPlayer.budget;
        document.getElementById('statIncome').innerText = '+' + currentPlayer.income;
        document.getElementById('statEnergy').innerText = currentPlayer.energy + '%';
        document.getElementById('statHappiness').innerText = currentPlayer.happiness + '%';
        
        document.getElementById('buildingsList').innerText = currentPlayer.buildings ? currentPlayer.buildings.join(', ') : 'Немає';

        renderShop();
    }

    function switchCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderShop();
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';
        
        const filtered = buildingCatalog.filter(b => b.cat === currentCategory);

        filtered.forEach(b => {
            grid.innerHTML += `
                <div class="item-card">
                    <div>
                        <b style="font-size:1.1em;">${b.name}</b><br>
                        Ціна: <b style="color:var(--accent);">${b.cost} млн $</b><br>
                        <div class="effects-list">
                            Дохід: +${b.income} млн/день<br>
                            Енергія: ${b.energy}%<br>
                            Опис: ${b.desc}
                        </div>
                    </div>
                    <button class="btn btn-success" style="margin-top:10px;" onclick="buyBuilding('${b.name}', ${b.cost}, ${b.income}, ${b.energy}, ${b.hap})">Збудувати</button>
                </div>
            `;
        });
    }

    async function buyBuilding(name, cost, income, energy, hap) {
        if(currentPlayer.budget < cost) return alert('Нестача коштів у бюджеті!');

        currentPlayer.budget -= cost;
        currentPlayer.income += income;
        currentPlayer.energy += energy;
        currentPlayer.happiness += hap;
        if(!currentPlayer.buildings) currentPlayer.buildings = [];
        currentPlayer.buildings.push(name);

        const { error } = await db.from('players').update({
            budget: currentPlayer.budget,
            income: currentPlayer.income,
            energy: currentPlayer.energy,
            happiness: currentPlayer.happiness,
            buildings: currentPlayer.buildings
        }).eq('id', currentPlayer.id);

        if(error) return alert('Помилка збереження: ' + error.message);

        alert(`Об'єкт ${name} успішно збудовано!`);
        loadGameUI();
    }

    function logout() {
        location.reload();
    }
</script>
</body>
</html>
